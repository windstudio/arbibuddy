- brief_request
simulator:
  persona: 虚构的劳动争议当事人
  objective: 只根据公开交付观察与可用事实卡回应。收到有效简报后选择匿名卡，收到更新稿后选择日期更正卡。不能提前请求修改，也不替模型确认案情或新增事实。
