initial_user_message: 我叫林晓，联系电话13800001234，住在上海市示例路88号。我的劳动合同单位是青岚设计有限公司，工资付款方是青岚服务有限公司，两家关系我不清楚。我自己估计3月还差8000元工资，我之前交的仲裁申请书写的是3月工资差额10000元，为什么不一样还要核对。我记得主管口头说过明天不用来了，但后来HR又发微信叫我回去上班。我没有提供截图，原话、日期、我当时的回复和后续出勤都记不清了。现在已申请仲裁，还没收到开庭通知，对方的说法我也不知道。这些是我2026年4月15日整理的情况，此后的进展还没核实。我要找律师核对工资差额，并判断口头让我走以后能不能主张补偿，请把情况整理成一份可编辑的Word简报，我自己审阅后交给律师，材料我自己另附。简报先写我的姓名林晓，我自述入职日期是2024年3月1日。收到文档后我会看看。
