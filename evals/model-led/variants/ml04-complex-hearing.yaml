schema_version: 2
id: ML04-complex-hearing
title: 案情简报多事项与开庭安排
initial_user_message: 我叫林晓，联系电话13800001234，住在上海市示例路88号。2024年11月我到青岚设计有限公司做设计，前三个月没签书面合同，后来和设计公司补签，工资由青岚服务有限公司发，两家关系我不清楚。2026年1月公司口头通知降薪，我没有同意；我估计3月少发8000元，但提交的仲裁申请书请求3月工资差额10000元，差异原因不清楚。3月下旬主管口头说过大意是明天不用来了，具体日期和原话记不清；HR随后发微信让我返岗，我收到后没有回去。公司后来告诉我已经按旷工处理，我不同意。返岗微信和申请书原件没提供。我还提过有降薪通知照片，目前无法取得；手头有3月工资流水，尚未提供。已申请仲裁，也收到开庭通知，我抄录的是“2026年5月8日上午9时开庭”，原通知还没上传。这是我2026年4月15日整理的情况，此后进展未核实。我目前明确希望追工资差额，没决定再提出其他请求，想问律师没签合同这段期间、降薪、离岗后没返岗会对我有什么影响。请整理可编辑Word简报，我自己审阅后交律师，材料另附，接下来没空回复。
initial_fact_ids:
- brief_request
simulator:
  persona: 虚构的劳动争议当事人
  objective: 如实回应既定场景，不编造缺失材料或确认。本场景首条消息已表达咨询目的，之后没有补充答复。
  max_facts_per_turn: 1
  max_unavailable_uses: 0
fact_pool:
- id: brief_request
  message: 请整理一份Word简报供我审阅后交律师，核对3月工资差额及口头让我走后的补偿问题，未核实事项留到面谈。
