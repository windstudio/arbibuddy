title: 律师简报多事项与开庭安排
initial_user_message: 我叫林晓，联系电话13800001234，住在上海市示例路88号。我的劳动合同单位是青岚设计有限公司，工资付款方是青岚服务有限公司，两家关系我不清楚。我自己估计3月还差8000元工资，我之前交的仲裁申请书写的是3月工资差额10000元，为什么不一样还要核对。我记得主管口头说过明天不用来了，但后来HR又发微信叫我回去上班。我没有提供截图，原话、日期、我当时的回复和后续出勤都记不清了。现在已申请仲裁，已收到开庭通知，我抄录的文字是“2026年5月8日上午9时开庭”，原通知还没上传，对方的说法我也不知道。这些是我2026年4月15日整理的情况，此后的进展还没核实。我要找律师核对工资差额，并判断口头让我走以后能不能主张补偿，请把情况整理成一份可编辑的Word简报，我自己审阅后交给律师，材料我自己另附。工资和离职经过是两个不同争议，请把复杂经过按时间顺序梳理好，再分别整理两个问题。我接下来没空回复了。
