schema_version: 2
id: ML01-unknown-provenance-targeted-v2
title: ML01 明确请求三项排查后的连续未知来源定向变体
relative_calendar:
  departure_months_ago: 3
  wage_start_months_ago: 5
  last_demand_months_ago: 2
initial_user_message: 我想梳理工资、季度绩效奖金和加班费，准备劳动仲裁材料。我 2024 年 3 月 1 日入职上海澄明云科信息技术有限公司，岗位是产品经理，主要在浦东工作；合同约定月薪 12000 元，工资和社保也由这家公司处理，但注册地址、办公地址和收件地址我说不准。{departure_date}已离职，离职方式和手续尚未核清，暂时找不到解除通知、离职申请、离职证明或协议。{wage_period}工资没足额发，12000
  元是否为固定月薪总额、有无津贴或提成，以及每月应发、到账和差额都待核。合同有季度绩效奖金，这次主张的那期没收到，具体季度、条件和金额要查。{wage_period_short}有加班，有些由领导在工作群安排，日期、时数、审批记录及工时制度待核。我有合同、部分工资流水和工资条、考勤截图、项目群聊天、内部邮件及催款记录，考勤不完整，奖金规则可能在邮件里。离职后半年内我通过邮件和工作群追讨过工资，公司仍未付清；最后一次催要的细节我可以补充，尚未仲裁、起诉或调解。这次先处理上述三项，我的身份和联系方式稍后补。请先建档，说明现有材料能支持什么、金额和补证缺口，这次先完成排查和建档，暂不起草候选文书。另外，我想了解一下还有没有其他常见劳动争议问题可能与我有关；如果需要，可以继续向我核对。
  请分别核对以前各季度奖金是否发放、未休年休假以及社保和住房公积金记录，每轮只问一个问题。我会按被问的事项回答；未问事项请列为你待收集的缺口。
initial_fact_ids:
- employment
- party_and_workplace
- wage_dispute
- performance_bonus
- overtime
- evidence
- limitation_and_proceedings
- termination_and_claim_scope
- analysis_scope
simulator:
  persona: 虚构劳动争议中的当事人
  objective: 只依已声明事实回答当前问题，不编造。主要工作地是上海浦东。用户明确要求分别核对奖金历史、未休年休假、社保公积金；A 问对应事项时选择 bonus_history_unknown、annual_leave_unknown、social_contribution_unknown，不用通用
    unavailable 替代匹配的未知卡。范围询问选择 rights_scan_scope。若 A 要初步摘要确认，按真实已知事实选择 initial_summary_confirmation；这不结束三项排查。三项排查完成且 A 询问最终事实或材料补充时选择
    final_supplement_none。本变体只检查连续未知答复后的档案来源，暂不要求候选交付。A 已结束当前请求且没有匹配的后续目标时选择 stop，保留覆盖不足结果，不反复发送 unavailable。
  max_facts_per_turn: 1
  unavailable_message: 这个具体信息我现在说不准，得核对材料；先标成待核项，其他已知部分可以继续。
  max_unavailable_uses: null
  confirmation_fact_id: final_confirmation
  confirmation_prerequisite_fact_ids:
  - wage_dispute
  - performance_bonus
  - overtime
  - evidence
  - rights_scan_scope
  - final_supplement_none
  confirmation_conflict_fact_ids:
  - initial_summary_confirmation
  confirmation_conflict_markers:
  - 欠薪月份仍待核
  - 工资欠付期间仍待核
  - 欠付工资的月份尚不清楚
  - 季度绩效奖金已收到
  - 季度奖金已经支付
  - 没有发生加班
  - 未发生加班
  - 没有任何证据材料
  prompt_version: scenario-responder-prompt-v16
  schema_version: scenario-responder-schema-v4
  confirmation_summary_required_groups:
    wage_shortfall:
    - 未足额
    - 没足额发
    - 欠发工资
    - 拖欠工资
    - 工资未付清
    bonus_unpaid:
    - 未收到
    - 未发
    - 未付
    - 没拿到
    overtime_claim:
    - 有加班
    - 发生加班
    - 月加班
    - 加班期间
    - 加班安排
    - 加班由
    scope_wage:
    - 工资差额
    - 欠发工资
    - 拖欠工资
    scope_bonus:
    - 季度绩效奖金
    - 季度奖金
    scope_overtime:
    - 加班费
fact_pool:
- id: employment
  message: 我是 2024 年 3 月 1 日入职，{departure_date}已离职，目前不在职，当前劳动关系已经结束；签过劳动合同，岗位是产品经理，约定月薪 12000 元。
- id: party_and_workplace
  max_uses: 10
  message: 劳动合同上的单位是“上海澄明云科信息技术有限公司”，工资和社保也由这家公司处理。我主要在上海市浦东新区工作，注册地址、办公地址和收件地址我现在说不准。
- id: wage_dispute
  max_uses: 1
  message: '{wage_period}的工资没有足额发。合同写月薪 12000 元，但我还没核对这是不是固定月薪总额、有没有津贴或提成；每月应发、到账和差额也还没整理出来。'
- id: performance_bonus
  max_uses: 2
  message: 合同里有季度绩效奖金，这部分目前没拿到。我还得查合同、公司制度、邮件和工资条，才能说清是哪一季、是否满足发放条件以及具体金额。
- id: bonus_history_unknown
  max_uses: 1
  message: 以前是否收到过各季度的绩效奖金我还没核对，要查工资条和奖金记录；我目前只确认这次主张的那期奖金没有收到。
- id: overtime
  max_uses: 1
  message: '{wage_period}有加班，有些是领导在工作群里安排的。具体哪天、加到几点还没逐日整理；有些考勤截图和工作群记录，审批记录不全，工时制度我也不清楚。'
- id: evidence
  max_uses: 1
  message: 我手头有劳动合同、部分月份的工资流水和工资条、考勤截图、项目群聊天、内部邮件以及催款记录。奖金规则可能在邮件里，考勤记录也不完整。
- id: limitation_and_proceedings
  max_uses: 1
  message: 离职后半年内，我通过邮件和工作群追讨过工资，公司一直没付清；最后一次催要的细节我可以补充。我还没有申请仲裁、起诉或参加调解。
- id: last_demand
  max_uses: 1
  message: 最后一次催讨是 {last_demand_date}通过工作群发消息，要求补发{wage_period}的工资差额；没有在这次消息中催要季度绩效奖金或加班费。公司在群里回复会核对，但没有承诺付款日期，也没有付清。我保存了该群聊截图和原始聊天记录，具体发送和回复时间可以据此核对。
- id: termination_and_claim_scope
  max_uses: 1
  message: 我已经离职，但当时的手续和具体离职方式还没核对清楚，暂时找不到解除通知、离职申请、离职证明或协议。这次先处理工资、季度绩效奖金和加班费；我的姓名、证件、住址和联系方式稍后补。
- id: analysis_scope
  max_uses: 1
  message: 我这次先处理工资差额、季度绩效奖金和加班费。现有材料能支持的先说明，金额缺口和补证方向列清楚，并准备带明确待核项的仲裁申请候选稿。申请人和单位主体信息我之后补。
- id: rights_scan_scope
  max_uses: 2
  message: 本轮请求仍只处理工资差额、这期季度绩效奖金和加班费；其他请求暂不增加。不过请先继续分别核对以前各季度奖金是否发放、未休年休假以及社保和住房公积金记录，我会按被问的事项回答。现在先不做候选文书。
- id: final_supplement_none
  max_uses: 1
  message: 目前没有其他事实或材料要补充；没核清的地方先保留待核，按已说的继续。
- id: confirmation_summary_revision_requested
  max_uses: 1
  message: 这段摘要还没说清工资未足额发、这期季度绩效奖金未收到和加班这三项基本情况。请按我已说的简要补进摘要，不清楚的仍标待核；本次先处理工资差额、季度绩效奖金和加班费。补充后我再确认。
- id: initial_summary_confirmation
  max_uses: 10
  requires_sent_facts:
  - wage_dispute
  - performance_bonus
  - overtime
  - evidence
  message: 上述已知事实和本轮工资差额、这期季度绩效奖金、加班费三项范围基本准确，具体金额、材料及法律口径未核清的仍待核。可以继续收集和核对其他权益方向；最终补充后，再给我完整摘要确认后准备候选材料。
- id: final_confirmation
  max_uses: 10
  message: 事实和本轮三项处理范围确认；法律时效和金额口径中没核清的仍按待核处理。请按当前档案准备仲裁申请候选稿、证据目录和提交前核对清单，暂不定稿。
- id: annual_leave_unknown
  max_uses: 1
  message: 未休年休假这件事我还没核对，具体是否存在、休了多少要查休假记录。
- id: social_contribution_unknown
  max_uses: 1
  message: 社保和住房公积金的缴费记录我目前还没查，具体缴纳情况说不准。
milestones:
- id: archive_written
  response_any:
  - 案情档案
  - 已保存
  - 记录到档案
expect:
  required_artifacts:
  - case_archive
  required_deliveries: []
  allow_extra_deliveries: false
  min_turns: 4
  allow_degraded_delivery: true
  degradation_markers:
  - 未提供
  - 不能虚称
  - 无法
  - 不可用
  response_markers:
    facts:
    - 事实
    - 材料
    - 待核
  completion_paths:
  - id: archive_after_unknown_answers
    requires_sent_facts:
    - bonus_history_unknown
    - annual_leave_unknown
    - social_contribution_unknown
    - final_supplement_none
    required_artifacts:
    - case_archive
    required_response_groups:
    - facts
  max_turns: 12
